name: SecureHire CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    env:
      LAB_ENABLE: "true"
      APP_ENV: "testing"
      SECRET_KEY: "synthetic-ci-secret-key-not-for-production"
      TEST_DATABASE_URL: "sqlite+pysqlite:///:memory:"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SecureHire and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          python -m pip install bandit

      - name: Run Bandit static security scan
        run: |
          bandit -r app run_local.py --exit-zero

      - name: Run SecureHire test suite
        run: |
          python -m pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: securehire-test-results
          path: test-results.xml
