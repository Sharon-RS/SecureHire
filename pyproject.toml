[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "securehire"
version = "0.1.0"
description = "A localhost-only academic freelance marketplace security lab"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-Login>=0.6,<1.0",
    "Flask-Migrate>=4.0,<5.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-WTF>=1.2,<2.0",
    "PyMySQL>=1.1,<2.0",
    "email-validator>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyrefly]
python-interpreter-path = ".venv/Scripts/python.exe"
search-path = [
    ".",
    "tests",
]
